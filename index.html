<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  :root {
    --ink: #1b1f23;
    --paper: #f6f4ef;
    --line: #d8d3c7;
    --accent: #2f6f5e;
    --accent-soft: #e4efe9;
    --bubble-mine: #2f6f5e;
    --bubble-theirs: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
  }
  .card h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .card p.sub {
    margin: 0 0 20px;
    color: #6b6459;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: white; margin-bottom: 8px; }
  .btn-secondary { background: var(--accent-soft); color: var(--accent); }
  .error { color: #b3413c; font-size: 13px; margin: -4px 0 10px; min-height: 16px; }

  #app { display: none; width: 100%; max-width: 720px; height: 92vh; }
  .layout {
    display: flex;
    height: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: white;
  }
  .sidebar {
    width: 230px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    background: #faf9f6;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }
  .sidebar-header .me { font-weight: 600; font-size: 14px; }
  .sidebar-header .signout {
    background: none; border: none; color: #6b6459; font-size: 12px;
    text-decoration: underline; padding: 4px 0; width: auto; margin-top: 6px; cursor: pointer;
  }
  .find-box { padding: 12px; border-bottom: 1px solid var(--line); }
  .find-box input { margin: 0; font-size: 14px; padding: 9px 10px; }

  .chat-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    font-size: 15px;
  }
  .chat-header.empty { color: #a39c8f; font-weight: 400; }
  #messages {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    padding: 9px 13px;
    border-radius: 14px;
    max-width: 72%;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .mine { align-self: flex-end; background: var(--bubble-mine); color: white; border-bottom-right-radius: 4px; }
  .theirs { align-self: flex-start; background: #f0eee8; border-bottom-left-radius: 4px; }
  form#msg-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  form#msg-form input { margin: 0; }
  form#msg-form button { width: auto; padding: 0 20px; }
</style>
</head>
<body>

<div id="auth-card" class="card">
  <h1>Sign in</h1>
  <p class="sub">Username and password only. No email required.</p>
  <input id="username" type="text" placeholder="Username" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <div id="auth-error" class="error"></div>
  <button class="btn-primary" id="login-btn">Log in</button>
  <button class="btn-secondary" id="signup-btn">Create account</button>
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="me">@<span id="my-name"></span></div>
        <button class="signout" id="signout-btn">Sign out</button>
      </div>
      <div class="find-box">
        <input id="target-user" type="text" placeholder="Chat with username...">
      </div>
    </div>
    <div class="chat-pane">
      <div class="chat-header empty" id="chat-header">Pick someone to chat with</div>
      <div id="messages"></div>
      <form id="msg-form" style="display:none;">
        <input id="msg-input" autocomplete="off" placeholder="Type a message...">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- Fill these in from Supabase: Project Settings > API ----
  const SUPABASE_URL = "https://kgeyxlblximxgfntcdyy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_e2MWsX_CtAWb7wpjklZ36g_Wc17fxI2";
  // ---------------------------------------------------------------

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let myId = null;
  let myUsername = "";
  let targetId = null;
  let targetUsername = "";
  let channel = null;

  function fakeEmail(username) {
    return `${username.trim().toLowerCase()}@chatapp.local`;
  }

  function showError(msg) {
    document.getElementById('auth-error').innerText = msg;
  }

  document.getElementById('signup-btn').onclick = async () => {
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    showError('');
    if (!username || !password) return showError('Enter a username and password.');
    if (!/^[a-z0-9_]{3,20}$/.test(username)) return showError('Username: 3-20 chars, letters/numbers/underscore only.');

    const { data, error } = await sb.auth.signUp({ email: fakeEmail(username), password });
    if (error) return showError(error.message);

    // Save the username -> user id mapping (public directory row)
    const { error: profileError } = await sb.from('profiles').insert({ id: data.user.id, username });
    if (profileError) return showError('Username may be taken: ' + profileError.message);

    showError('Account created. You can log in now.');
  };

  document.getElementById('login-btn').onclick = async () => {
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    showError('');
    if (!username || !password) return showError('Enter a username and password.');

    const { data, error } = await sb.auth.signInWithPassword({ email: fakeEmail(username), password });
    if (error) return showError('Login failed. Check your username and password.');

    myId = data.user.id;
    myUsername = username;
    enterApp();
  };

  document.getElementById('signout-btn').onclick = async () => {
    await sb.auth.signOut();
    if (channel) sb.removeChannel(channel);
    location.reload();
  };

  function enterApp() {
    document.getElementById('auth-card').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('my-name').innerText = myUsername;
    listenForMessages();
  }

  let lookupTimer = null;
  document.getElementById('target-user').addEventListener('input', (e) => {
    clearTimeout(lookupTimer);
    lookupTimer = setTimeout(() => openConversation(e.target.value.trim().toLowerCase()), 400);
  });

  async function openConversation(username) {
    const header = document.getElementById('chat-header');
    const form = document.getElementById('msg-form');
    const messagesDiv = document.getElementById('messages');
    messagesDiv.innerHTML = '';
    targetId = null;
    targetUsername = '';

    if (!username) {
      header.className = 'chat-header empty';
      header.innerText = 'Pick someone to chat with';
      form.style.display = 'none';
      return;
    }
    if (username === myUsername) {
      header.className = 'chat-header empty';
      header.innerText = "That's you.";
      form.style.display = 'none';
      return;
    }

    const { data: profile, error } = await sb
      .from('profiles')
      .select('id, username')
      .eq('username', username)
      .maybeSingle();

    if (error || !profile) {
      header.className = 'chat-header empty';
      header.innerText = `No user @${username}`;
      form.style.display = 'none';
      return;
    }

    targetId = profile.id;
    targetUsername = profile.username;
    header.className = 'chat-header';
    header.innerText = `@${targetUsername}`;
    form.style.display = 'flex';

    const { data: history } = await sb
      .from('messages')
      .select('*')
      .or(`and(sender_id.eq.${myId},receiver_id.eq.${targetId}),and(sender_id.eq.${targetId},receiver_id.eq.${myId})`)
      .order('created_at', { ascending: true });

    (history || []).forEach(m => appendMessage(m.message_text, m.sender_id === myId ? 'mine' : 'theirs'));
  }

  document.getElementById('msg-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !targetId) return;
    input.value = '';

    const { error } = await sb.from('messages').insert({
      sender_id: myId,
      receiver_id: targetId,
      message_text: text
    });
    if (error) alert('Failed to send: ' + error.message);
  });

  function listenForMessages() {
    channel = sb
      .channel('messages-realtime')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        const m = payload.new;
        if (!targetId) return;
        if (m.sender_id === myId && m.receiver_id === targetId) {
          appendMessage(m.message_text, 'mine');
        } else if (m.sender_id === targetId && m.receiver_id === myId) {
          appendMessage(m.message_text, 'theirs');
        }
      })
      .subscribe();
  }

  function appendMessage(text, type) {
    const messagesDiv = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.innerText = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
</script>
</body>
</html>
