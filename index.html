<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Message</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-card" class="card">
  <h1>Sign in</h1>
  <p class="sub">Username and password only. No email required.</p>
  <input id="username" type="text" placeholder="Username" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <div id="auth-error" class="error"></div>
  <button class="btn-primary" id="login-btn">Log in</button>
  <button class="btn-secondary" id="signup-btn">Create account</button>
</div>

<div id="app">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="me">@<span id="my-name"></span></div>
        <button class="signout" id="signout-btn">Sign out</button>
      </div>
      <div class="find-box">
        <input id="target-user" type="text" placeholder="Chat with username...">
      </div>
      <div id="conversation-list"></div>
    </div>
    <div class="chat-pane">
      <div class="chat-header empty" id="chat-header">
        <button id="back-btn" class="back-btn" aria-label="Back">&larr;</button>
        <span id="chat-header-text">Pick someone to chat with</span>
      </div>
      <div id="messages"></div>
      <form id="msg-form" style="display:none;">
        <input id="msg-input" autocomplete="off" placeholder="Type a message...">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
